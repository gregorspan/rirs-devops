# SonarCloud Project Configuration
# Replace <your-sonarcloud-project-key> and <your-sonarcloud-organization> with your actual values

sonar.projectKey=gregorspan-rirs2026
sonar.organization=gregorspan-rirs2026
sonar.host.url=https://sonarcloud.io

# Source code paths
sonar.sources=.
sonar.exclusions=**/node_modules/**, **/dist/**, **/build/**, **/coverage/**, **/venv/**, **/__pycache__/**, **/.next/**, **/.git/**

# Coverage reports
# Frontend coverage (JavaScript/TypeScript)
sonar.javascript.lcov.reportPaths=client/coverage/lcov.info

# Backend coverage (Python)
sonar.python.coverage.reportPaths=server/coverage.xml

# Language settings
sonar.sourceEncoding=UTF-8

# Test paths
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.py,**/test_*.py

# Exclude test files from main analysis
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/venv/**
