services:
  # Backend service
  - type: web
    name: rirs-backend
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    dockerCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: CORS_ORIGINS
        value: https://rirs-frontend.onrender.com
    healthCheckPath: /
    plan: free

  # Frontend service
  - type: web
    name: rirs-frontend
    runtime: docker
    dockerfilePath: ./client/Dockerfile
    dockerContext: ./client
    envVars:
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        value: https://rirs-backend.onrender.com/api
    healthCheckPath: /
    plan: free
