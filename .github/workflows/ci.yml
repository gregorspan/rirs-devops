name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, production ]
  pull_request:

env:
  DOCKER_REGISTRY: docker.io
  FRONTEND_IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/rirs-frontend
  BACKEND_IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/rirs-backend

jobs:
  # Test jobs
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run tests with coverage
        run: npm test

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: client/coverage
          if-no-files-found: error

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run pytest with coverage
        run: pytest --cov=main --cov-report=xml:coverage.xml --cov-report=term
        env:
          PYTHONPATH: .

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server/coverage.xml
          if-no-files-found: error

  # SonarCloud Analysis
  sonarcloud-analysis:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: client/coverage

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: server

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Quality Gate Check - Blocks all further pipeline steps if not passed
  quality-gate-check:
    name: Quality Gate Check
    runs-on: ubuntu-latest
    needs: sonarcloud-analysis
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for SonarCloud analysis to complete
        run: |
          echo "⏳ Waiting for SonarCloud analysis to complete..."
          sleep 15

      - name: Check SonarCloud Quality Gate Status
        run: |
          PROJECT_KEY="gregorspan_rirs-devops"
          ORGANIZATION="gregorspan-rirs2026"
          
          echo "🔍 Checking Quality Gate status for project: $PROJECT_KEY"
          
          # Get the quality gate status from SonarCloud API
          QG_STATUS=$(curl -s -u "${{ secrets.SONAR_TOKEN }}:" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=$PROJECT_KEY" | \
            grep -o '"status":"[^"]*"' | cut -d'"' -f4)
          
          if [ -z "$QG_STATUS" ]; then
            echo "⚠️  Could not retrieve Quality Gate status. This might be the first analysis."
            echo "❌ Quality Gate check failed - cannot proceed with pipeline"
            echo "Please ensure SonarCloud analysis completed successfully."
            exit 1
          fi
          
          echo "📊 Quality Gate Status: $QG_STATUS"
          
          if [ "$QG_STATUS" != "OK" ]; then
            echo "❌ Quality Gate FAILED! Status: $QG_STATUS"
            echo "🔗 View details: https://sonarcloud.io/project/overview?id=$PROJECT_KEY"
            echo ""
            echo "Pipeline blocked: Quality Gate must pass before continuing."
            echo "Please fix the quality issues before proceeding."
            exit 1
          else
            echo "✅ Quality Gate PASSED!"
            echo "🔗 View details: https://sonarcloud.io/project/overview?id=$PROJECT_KEY"
            echo "✅ Pipeline can proceed with build and deployment steps."
          fi

  # Build jobs
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-test, quality-gate-check]
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8000/api' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            client/.next
            client/public
          retention-days: 7

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: [backend-test, quality-gate-check]
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Create build directory
        run: mkdir -p build

      - name: Copy application files
        run: |
          cp main.py build/
          cp requirements.txt build/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: server/build
          retention-days: 7

  # GitHub Pages deployment
  deploy-github-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: quality-gate-check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/production')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Docker build jobs for Development environment (main branch)
  docker-build-frontend-dev:
    name: Build Frontend Docker Image (Development)
    runs-on: ubuntu-latest
    needs: frontend-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: Development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image with dev tag
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE_NAME }}:dev
            ${{ env.FRONTEND_IMAGE_NAME }}:dev-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.FRONTEND_IMAGE_NAME }}:buildcache,mode=max

  docker-build-backend-dev:
    name: Build Backend Docker Image (Development)
    runs-on: ubuntu-latest
    needs: backend-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: Development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image with dev tag
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE_NAME }}:dev
            ${{ env.BACKEND_IMAGE_NAME }}:dev-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE_NAME }}:buildcache,mode=max

  # Docker build jobs for Production environment (production branch)
  docker-build-frontend-prod:
    name: Build Frontend Docker Image (Production)
    runs-on: ubuntu-latest
    needs: [frontend-build, quality-gate-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    environment:
      name: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image with prod tag
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE_NAME }}:prod
            ${{ env.FRONTEND_IMAGE_NAME }}:prod-${{ github.sha }}
            ${{ env.FRONTEND_IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.FRONTEND_IMAGE_NAME }}:buildcache,mode=max

  docker-build-backend-prod:
    name: Build Backend Docker Image (Production)
    runs-on: ubuntu-latest
    needs: [backend-build, quality-gate-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    environment:
      name: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image with prod tag
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE_NAME }}:prod
            ${{ env.BACKEND_IMAGE_NAME }}:prod-${{ github.sha }}
            ${{ env.BACKEND_IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE_NAME }}:buildcache,mode=max

  # Deployment to Render (Development)
  deploy-render-frontend-dev:
    name: Deploy Frontend to Render (Development)
    runs-on: ubuntu-latest
    needs: [docker-build-frontend-dev, quality-gate-check]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: Development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Frontend to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}

      - name: Display Frontend URL
        run: |
          echo "✅ Frontend deployed successfully to Development"
          echo "🌐 Frontend URL: https://rirs-frontend-1jqg.onrender.com"

  deploy-render-backend-dev:
    name: Deploy Backend to Render (Development)
    runs-on: ubuntu-latest
    needs: [docker-build-backend-dev, quality-gate-check]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: Development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Backend to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}

      - name: Display Backend URL
        run: |
          echo "✅ Backend deployed successfully to Development"
          echo "🌐 Backend URL: https://rirs-backend-um8m.onrender.com"
          echo "🔗 API Endpoint: https://rirs-backend-um8m.onrender.com/api"

  # Deployment to Render (Production) - requires manual approval
  deploy-render-frontend-prod:
    name: Deploy Frontend to Render (Production)
    runs-on: ubuntu-latest
    needs: [docker-build-frontend-prod, quality-gate-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    environment:
      name: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Frontend to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}

      - name: Display Frontend URL
        run: |
          echo "✅ Frontend deployed successfully to Production"
          echo "🌐 Frontend URL: https://rirs-frontend-1jqg.onrender.com"

  deploy-render-backend-prod:
    name: Deploy Backend to Render (Production)
    runs-on: ubuntu-latest
    needs: [docker-build-backend-prod, quality-gate-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    environment:
      name: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Backend to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}

      - name: Display Backend URL
        run: |
          echo "✅ Backend deployed successfully to Production"
          echo "🌐 Backend URL: https://rirs-backend-um8m.onrender.com"
          echo "🔗 API Endpoint: https://rirs-backend-um8m.onrender.com/api"

  deploy-summary-dev:
    name: Deployment Summary (Development)
    runs-on: ubuntu-latest
    needs: [deploy-render-frontend-dev, deploy-render-backend-dev]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Display deployment summary
        run: |
          echo "## 🚀 Development Deployment URLs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend Application" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://rirs-frontend-1jqg.onrender.com" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend API" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://rirs-backend-um8m.onrender.com" >> $GITHUB_STEP_SUMMARY
          echo "- **API Endpoint:** https://rirs-backend-um8m.onrender.com/api" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Images (Development)" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ${{ env.FRONTEND_IMAGE_NAME }}:dev" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: ${{ env.BACKEND_IMAGE_NAME }}:dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### GitHub Pages" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ github.event.repository.html_url }}" >> $GITHUB_STEP_SUMMARY
          
          echo "✅ All Development deployments completed successfully"
          echo ""
          echo "🌐 Application URLs:"
          echo "   Frontend: https://rirs-frontend-1jqg.onrender.com"
          echo "   Backend:  https://rirs-backend-um8m.onrender.com"
          echo "   API:      https://rirs-backend-um8m.onrender.com/api"
          echo ""
          echo "📦 Docker Images (dev tag):"
          echo "   Frontend: ${{ env.FRONTEND_IMAGE_NAME }}:dev"
          echo "   Backend:  ${{ env.BACKEND_IMAGE_NAME }}:dev"

  deploy-summary-prod:
    name: Deployment Summary (Production)
    runs-on: ubuntu-latest
    needs: [deploy-render-frontend-prod, deploy-render-backend-prod]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    steps:
      - name: Display deployment summary
        run: |
          echo "## 🚀 Production Deployment URLs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend Application" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://rirs-frontend-1jqg.onrender.com" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend API" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://rirs-backend-um8m.onrender.com" >> $GITHUB_STEP_SUMMARY
          echo "- **API Endpoint:** https://rirs-backend-um8m.onrender.com/api" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Images (Production)" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ${{ env.FRONTEND_IMAGE_NAME }}:prod" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: ${{ env.BACKEND_IMAGE_NAME }}:prod" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### GitHub Pages" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ github.event.repository.html_url }}" >> $GITHUB_STEP_SUMMARY
          
          echo "✅ All Production deployments completed successfully"
          echo ""
          echo "🌐 Application URLs:"
          echo "   Frontend: https://rirs-frontend-1jqg.onrender.com"
          echo "   Backend:  https://rirs-backend-um8m.onrender.com"
          echo "   API:      https://rirs-backend-um8m.onrender.com/api"
          echo ""
          echo "📦 Docker Images (prod tag):"
          echo "   Frontend: ${{ env.FRONTEND_IMAGE_NAME }}:prod"
          echo "   Backend:  ${{ env.BACKEND_IMAGE_NAME }}:prod"
